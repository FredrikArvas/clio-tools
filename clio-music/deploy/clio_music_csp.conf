# clio_music_csp.conf — Content-Security-Policy för clio_music.
# Installeras som /etc/nginx/snippets/clio_music_csp.conf och inkluderas på server-nivå.
#
# Läge: Content-Security-Policy (enforcing sedan 2026-10-11, efter testperiod i Report-Only).
# Enforcing görs med deploy_enforce.sh, som bara byter rubriknamnet till Content-Security-Policy.
#
# Skript: strikt 'self' + Googles taggbibliotek (inga inline-skript; index.php skriver data i ett
#   <script type="application/json">-block som inte körs).
# Stilar: 'unsafe-inline' är ett medvetet undantag (style-attribut i vyerna och <style> i admin).
# Google Analytics: gtag.js hämtas från googletagmanager.com och skickar mätpunkter till
#   *.google-analytics.com / *.analytics.google.com.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
