# clio_music_security_headers.conf — säkerhetsrubriker för clio_music.
# Installeras som /etc/nginx/snippets/clio_music_security_headers.conf och inkluderas på server-nivå
# i nginx_clio_music.conf. Se kommentaren där om nginx-arv av add_header.
# Cloudflare sätter inga av dessa rubriker (kontrollerat med curl -sI), så inget dubbleras.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Spelaren behöver varken kamera, mikrofon eller plats.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Äldre webbläsare; moderna använder frame-ancestors i CSP.
add_header X-Frame-Options "DENY" always;
