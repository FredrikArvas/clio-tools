;
; Egen PHP-FPM-pool för admin/upload.php (= /etc/php/8.3/fpm/pool.d/clio_music_upload.conf).
; Bara nginx-locationen "= /admin/upload.php" pekar på den här socketen. Övriga sajten och
; andra sajter på servern kör kvar i poolen www med php.ini:s gränser (2M/8M/30 s).
; Samma användare och php.ini som www, så sessionerna (PHPSESSID, files) delas.
; Validera: sudo php-fpm8.3 -t   Aktivera: sudo systemctl reload php8.3-fpm

[clio_music_upload]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-clio_music_upload.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Uppladdningar sker en i taget från en admin: få processer, startas vid behov.
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 60s

; UPLOAD_MAX_BYTES (95 MB) + multipart-overhead. nginx-locationen tillåter 96M.
php_admin_value[upload_max_filesize] = 96M
php_admin_value[post_max_size] = 97M
php_admin_value[max_input_time] = 300
php_admin_value[max_execution_time] = 300
php_admin_value[max_file_uploads] = 1
