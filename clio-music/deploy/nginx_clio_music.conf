# Hastighetsgräns för inloggning (komplement till login_throttle.php).
# Trafiken kommer via cloudflared på loopback: där är riktig klient-IP CF-Connecting-IP.
# Från andra adresser används REMOTE_ADDR. Bara POST räknas (tom nyckel = ingen gräns).
map $remote_addr $clio_music_client_ip {
    127.0.0.1 $http_cf_connecting_ip;
    default   $remote_addr;
}
map $request_method $clio_music_login_key {
    POST    $clio_music_client_ip;
    default "";
}
limit_req_zone $clio_music_login_key zone=clio_music_login:1m rate=10r/m;

# Grov gräns för JSON-API:erna (komplement till rate_limit.php i PHP): spelaren gör flera anrop i rad,
# därför generös (2/s i snitt, burst 20). Tom nyckel (anrop utan CF-Connecting-IP, t.ex. lokalt test) räknas inte.
limit_req_zone $clio_music_client_ip zone=clio_music_api:2m rate=120r/m;

server {
    listen 8091;
    server_name _;

    root /var/www/clio_music;
    index index.php login.php;

    # Ingen versionsinformation i Server-rubriken eller felsidor.
    server_tokens off;
    # Utan egen gräns: 256k. /api/ har en snävare gräns nedan (PHP tillämpar dessutom MAX_REQUEST_BYTES).
    client_max_body_size 256k;

    # Säkerhetsrubriker (always = även på 4xx/5xx). OBS nginx-arv: en location som själv har
    # add_header ärver INGA rubriker härifrån. Inga locations har det idag; lägg annars till
    # samma två include-rader i den. Rubrikerna gäller även media via X-Accel-Redirect.
    # Cloudflare sätter inga av dessa (kontrollerat), så de dubbleras inte.
    include snippets/clio_music_security_headers.conf;
    include snippets/clio_music_csp.conf;

    # Block direct access to data/
    location /data/ { deny all; return 403; }

    # Media går ALLTID via stream.php (behörighetskontroll). URL:erna är oförändrade så att
    # profiler/spellistor/spelloggen (nycklade på URL) fortsätter fungera. ^~ vinner över
    # regex-locationen för .php nedan.
    location ^~ /music/  { include fastcgi.conf; fastcgi_param SCRIPT_FILENAME $document_root/stream.php; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location ^~ /lyrics/ { include fastcgi.conf; fastcgi_param SCRIPT_FILENAME $document_root/stream.php; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }

    # Nås bara via X-Accel-Redirect från stream.php. Snävt alias: aldrig hela webroten.
    location ^~ /_protected/music/  { internal; alias /var/www/clio_music/music/; }
    location ^~ /_protected/lyrics/ { internal; alias /var/www/clio_music/lyrics/; }

    location /tests/ { deny all; return 403; }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /login.php {
        limit_req zone=clio_music_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # JSON-API:erna: liten kropp (413 från nginx redan innan PHP) och hastighetsgräns.
    # Måste ligga före den generella .php-regexen (första matchande regex vinner).
    location ~ ^/api/.+\.php$ {
        client_max_body_size 64k;
        limit_req zone=clio_music_api burst=20 nodelay;
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht { deny all; }
}
