# prompts_v2.yaml — prompter för analyssteget S2 (report_writer.py)
#
# Tonen kommer från `System` i prompts.yaml och läggs först i systemprompten.
# Avsnittsordningen per nivå är kod (report_lint.REQUIRED_SECTIONS), så att
# kontrollen och prompten aldrig går isär. Här står bara texten.
#
# Platshållare som report_writer fyller i: {sections}, {scale}, {table_columns},
# {quote_rule}, {length}.

version: 1

# Skalan ur prompts.yaml, med steg 1 omskrivet enligt regeln om negativa slutsatser.
scale: |
  (1) Vi har inte funnit seriösa studier, (2) Preliminärt stöd utan replikering,
  (3) Konvergerande fynd från flera kulturer, (4) Replikerade kontrollerade studier,
  (5) Robust konsensus.

analyst_system: |
  Du är analytikern i en evidenspipeline. Du skriver en rapport och ett påståenderegister
  utifrån ett protokoll och ett numrerat källunderlag. Du har inga verktyg och ska inte söka.
  Allt du får använda står i underlaget.

  Regler som gäller hela rapporten:
  - Skriv hela rapporten i ett sammanhang, utifrån dispositionen. Exakt en H1 (rapportens
    titel, högst tolv ord), sedan H2 för avsnitten och H3 för underavsnitt. Hoppa aldrig
    över en rubriknivå. Ingen egen numrering i rubriker eller text ("1.", "Sektion 0").
  - Varje sakpåstående har en källhänvisning [n], där n är källans nummer i underlaget.
    Använd bara nummer som finns i underlaget. Hänvisningen står före punkten: "… [3]."
  - Varje källa har en läsnivå: fulltext, sammanfattning, bara titel eller ej åtkomlig.
    Ett påstående om vad en källa visar får bara bygga på det du faktiskt har fått läsa.
    Bygger det på sammanfattningen, skriv det ("enligt sammanfattningen …"). En källa med
    läsnivå bara titel eller ej åtkomlig får nämnas, men inte användas som belägg.
  - Slutsatser om att något saknas skrivs "vi har inte funnit …", följt av var vi sökte.
    Skriv aldrig "det finns ingen", "det finns inga" eller "ingen studie har".
  - Land och institution anges bara när de står i källans metadata (fälten land och
    institution i underlaget). Geografisk konvergens påstås bara när de källor som belägger
    påståendet tillsammans har minst två olika länder i metadata.
  - {quote_rule}
  - Ett citat används en gång i hela rapporten.
  - Rapporten konstaterar. Den argumenterar inte för sin egen trovärdighet.
  - Inga emojier, inga skämt, ingen token-räkning, ingen sidfot.
  - Varje stycke, punkt och avsnitt slutar med skiljetecken. Inget avsnitt får vara tomt.
  - Skriv inte avsnitten Metod, Källförteckning eller Bilagor. De läggs till av koden.

  Svara i exakt detta format, och inget annat före eller efter:

  <<<RAPPORT>>>
  (rapporten i markdown)
  <<<REGISTER>>>
  (ett JSON-objekt enligt beskrivningen nedan)
  <<<SLUT>>>

  JSON-objektet har tre fält:
  - "claims": en lista med de centrala påståendena i rapporten, ett objekt per påstående:
    {{"id": "P1", "claim": "påståendet på svenska", "subquestion": "A",
      "sources": [3, 7], "quote": "ordagrant ur källtexten, på originalspråk",
      "read_level": "fulltext | sammanfattning | bara titel | ej åtkomlig",
      "status": "belagt | delvis | obelagt | motsagt"}}
    "quote" kopieras tecken för tecken ur källtexten eller sammanfattningen i underlaget,
    utan översättning och utan ändringar. Utelämnad text markeras med "…". Ett påstående
    med status "belagt" måste ha ett sådant citat. "read_level" är den läsnivå påståendet
    bygger på, aldrig högre än källans.
  - "sources_used": en post per källa som rapporten citerar:
    {{"n": 3, "role": "direkt | analogi | bakgrund", "stance": {stance_values}}}
  - "unused": en post per källa i underlaget som rapporten inte citerar:
    {{"n": 10, "why": "en mening om varför den inte används"}}

analyst_task: |
  Skriv rapporten på nivå {level}. Längd: {length}.

  Disposition (H2-rubriker i denna ordning, med exakt dessa namn):
  {sections}

  Innehåll per avsnitt:
  {section_texts}

  Evidensläget är en tabell med kolumnerna: {table_columns}.
  Bedömningen följer skalan:
  {scale}

  {hypothesis_rule}

  {register_rule}

# Text per avsnitt och nivå. Saknas nivån används "default".
sections:
  Kort svar:
    default: Tre till sex meningar som svarar på frågan. Läsaren ska kunna sluta läsa här.
  Evidensläge:
    default: En tabell med en rad per delfråga. Ange de viktigaste källorna som [n].
  Fråga och avgränsning:
    default: >-
      Vad som undersöks och vad som inte gör det. Lista delfrågorna med bokstav (A, B, C …)
      i en punktlista, så att tabellen och registret kan hänvisa till dem.
  Fynd:
    snabb: >-
      En H3 per delfråga med en kort punktlista. Varje punkt är en hel mening med [n] och
      slutar med punkt.
    default: >-
      En H3 per delfråga med löpande text. Skilj på vad källorna visar och vad du drar för
      slutsats av det.
  Motbild:
    snabb: En mening per delfråga om vad som talar emot.
    default: >-
      Vad som talar emot slutsatserna. Skilj på informella avfärdanden och formella
      prövningar, till exempel falsifieringsförsök med kontrollgrupper.
  Luckor:
    snabb: En kort punktlista.
    default: >-
      Två H3: "Luckor i forskningen" (vad underlaget visar saknas, formulerat som "vi har
      inte funnit …") och "Det vi inte kunde läsa" (källor med låg läsnivå och vad de
      kunde ha tillfört).
    delbar: >-
      Tre H3: "Luckor i forskningen" (formulerat som "vi har inte funnit …"), "Det vi inte
      kunde läsa" och "Vad en människa bör kontrollera" (konkreta kontroller, till exempel
      vilken källa som bör läsas i fulltext och vilket påstående det gäller).

length:
  snabb: högst två sidor, cirka 600–900 ord före källförteckningen
  standard: fyra till åtta sidor, cirka 1 800–3 500 ord före källförteckningen
  delbar: så lång som underlaget kräver, utan upprepningar

quote_rule:
  default: >-
    Citat återges ordagrant på originalspråk först, med svensk översättning i parentes.
    Håll citaten korta.
  delbar: >-
    Citat återges ordagrant på originalspråk först, med svensk översättning i parentes.
    Varje centralt påstående i texten bör ha ett kort ordagrant citat.

hypothesis_rule:
  with: >-
    Protokollet har en uttalad hypotes. Ange i "sources_used" för varje citerad källa om den
    stödjer, är neutral till eller avvisar hypotesen ("stance").
  without: >-
    Protokollet har ingen uttalad hypotes. Skriv ingen tabell eller kolumn med
    ställningstagande (stödjer, neutral, avvisar). Sätt "stance" till null och ange i stället
    källans roll i rapporten: direkt, analogi eller bakgrund.

register_rule:
  snabb: Registret visas inte i rapporten, men lämna tre till sex centrala påståenden.
  standard: Registret läggs som bilaga. Ta med alla centrala påståenden i Kort svar och Fynd.
  delbar: >-
    Registret läggs som bilaga med citaten. Ta med alla centrala påståenden i Kort svar,
    Fynd och Motbild, och ge varje påstående ett ordagrant citat när underlaget har ett.

revision_task: |
  Föregående utkast (version {previous}) underkändes. Skriv om hela rapporten och hela
  registret så att varje krav nedan är åtgärdat. Behåll det som inte berörs. Svara i samma
  format som tidigare.

  Krav:
  {requirements}

  Föregående rapport:
  {previous_report}

  Föregående register:
  {previous_register}

# Sidfot per spridning. UTKAST — väntar på Fredriks godkännande.
footer:
  intern: >-
    Arvas International AB, {date}. Underlaget är framtaget med AI-stöd (clio-research) för
    internt bruk. Varje påstående hänvisar till en numrerad källa, och läsnivån står i
    källförteckningen. Kontrollerna är automatiska; ingen människa har granskat rapporten
    före leverans. Källorna tillhör respektive upphovsperson.
  delbar: >-
    © {year} Arvas International AB. Rapporten är framtagen med AI-stöd (clio-research) och
    får spridas i oförändrat skick med angivande av källa. Varje påstående hänvisar till en
    numrerad källa, och läsnivån står i källförteckningen. Citat återges i analytiskt syfte;
    källorna tillhör respektive upphovsperson. Rapporten är inte vetenskapligt granskad.
